
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Kad Jemputan Tunang</title>
  <meta name="description" content="Jemputan majlis tunang kami, sila klik untuk maklumat lanjut.">

  <!-- Font elegan -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fff5f5, #ffe4e1);
      text-align: center;
    }

    .sampul {
      display: inline-block;
      background: radial-gradient(circle, #ffe4e1, #ffb6c1);
      padding: 30px;
      border-radius: 50%;
      font-size: 80px;
      margin-top: 100px;
      cursor: pointer;
      animation: pulse 2s infinite;
      color: #d2691e;
    }

    .sampul p {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      margin-top: 10px;
      color: #8B0000;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .card {
      background: linear-gradient(135deg, #ffffff, #fff0f5);
      width: 95%;
      max-width: 500px;
      padding: 30px 20px;
      border-radius: 20px;
      margin: 20px auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border: 5px double #ff69b4;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      color: #8B0000;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 22px;
      color: #444;
      margin-bottom: 15px;
    }

    .hero-img {
      width: 100%;
      max-width: 300px;
      border-radius: 15px;
      margin: 15px 0;
      box-shadow: 0 0 20px rgba(255,182,193,0.6);
    }

    p {
      font-size: 16px;
      color: #333;
      line-height: 1.5;
    }

    #countdown {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
      color: #b22222;
      animation: warna 4s infinite;
    }

    @keyframes warna {
      0% { color: #b22222; }
      50% { color: #ff69b4; }
      100% { color: #b22222; }
    }

    button {
      background: linear-gradient(135deg, #b22222, #ff69b4);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    form {
      margin-top: 20px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ff69b4;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      resize: none;
    }

    label {
      font-weight: bold;
      color: #b22222;
      font-size: 14px;
    }

    /* Responsive untuk telefon kecil */
    @media (max-width: 480px) {
      h1 { font-size: 32px; }
      h2 { font-size: 18px; }
      p { font-size: 14px; }
      #countdown { font-size: 16px; }
      .card { padding: 20px 15px; }
    }
  </style>
</head>
<body>

<div class="sampul" onclick="bukaKad()">
  💌
  <p>Klik untuk buka jemputan</p>
</div>

<div class="card" id="kad" style="display:none;">
  <h1>Majlis Pertunangan 💍</h1>
  <h2>Albory Gysper & Syafikah Ahmad 🌸</h2>

  <img src="tunang.jpeg" class="hero-img">

  <p>Dengan penuh kesyukuran, kami menjemput anda ke majlis pertunangan kami.</p>

  <p>
    📅 Tarikh: 10 Oktober 2026<br>
    ⏰ Ketibaan: 12:00 Petang<br>
    📍 Tempat: Kampung Air Semporna
  </p>

  <h3>Menuju Hari Bahagia</h3>
  <h2 id="countdown"></h2>

  <h3>Sahkan Kehadiran</h3>
  <form action="https://formspree.io/f/meajjeaj" method="POST">
    <label>Nama Tetamu</label>
    <input type="text" name="Nama" required>

    <label>Kehadiran</label>
    <select name="Kehadiran" required>
      <option value="">Pilih</option>
      <option value="Hadir">Hadir</option>
      <option value="Tidak Hadir">Tidak Hadir</option>
    </select>

    <label>Ucapan untuk pasangan</label>
    <textarea name="Ucapan" rows="4"></textarea>

    <button type="submit">Hantar Ucapan 📝</button>
  </form>

  <a href="https://maps.app.goo.gl/WsE3JJa4ftWFX4L7A" target="_blank">
    <button>Buka Lokasi 📍</button>
  </a>
</div>

<script>
function bukaKad(){
  document.querySelector(".sampul").style.display="none";
  document.getElementById("kad").style.display="block";
  document.querySelector("audio").play();
}

// Countdown
var tarikhMajlis = new Date("October 10, 2026 12:00:00").getTime();
var kiraan = setInterval(function() {
  var sekarang = new Date().getTime();
  var beza = tarikhMajlis - sekarang;

  var hari = Math.floor(beza / (1000 * 60 * 60 * 24));
  var jam = Math.floor((beza % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minit = Math.floor((beza % (1000 * 60 * 60)) / (1000 * 60));
  var saat = Math.floor((beza % (1000 * 60)) / 1000);

  document.getElementById("countdown").innerHTML =
    hari + " Hari " + jam + " Jam " + minit + " Minit " + saat + " Saat";
}, 1000);
</script>

<audio autoplay loop>
  <source src="lagu.mpeg" type="audio/mpeg">
</audio>

</body>
